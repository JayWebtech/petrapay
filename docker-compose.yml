# Local development database only: `pnpm db:up`. Any Postgres 15+ works; production doesn't use Docker.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petrapay
      POSTGRES_PASSWORD: petrapay
      POSTGRES_DB: petrapay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrapay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
